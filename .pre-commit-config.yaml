# Checks that run on every commit. They cover the fast, purely local gates:
# formatting and linting for each language in the tree, plus the Python type
# check. Tests, native builds, and backend conformance are not here; they need
# a configured build and hardware, and run through CTest and the conformance
# scripts instead.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # The device photomasks under docs/tutorials/devices are legitimately
        # large and are tracked deliberately.
        args: [--maxkb=1024]
        exclude: ^docs/tutorials/devices/
      - id: end-of-file-fixer
        exclude: ^docs/tutorials/devices/
      - id: trailing-whitespace
        exclude: ^docs/tutorials/devices/

  - repo: local
    hooks:
      - id: format
        name: Format maintained files
        entry: uv run --isolated --locked --only-group quality python scripts/quality.py format
        language: system
        types: [text]
        require_serial: true
      - id: quality
        name: Check formatting, lint, and complexity
        entry: uv run --isolated --locked --only-group quality python scripts/quality.py check
        language: system
        types: [text]
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types: [python]
