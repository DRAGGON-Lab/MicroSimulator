name: CPU validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpu-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Run test suite
        run: uv run pytest

      - name: Run quick biophysics validation
        run: >-
          uv run python scripts/run_biophysics_benchmarks.py
          --suite quick --backend cpu --output build/biophysics-validation.json

      - name: Upload biophysics evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: biophysics-validation-${{ github.sha }}
          path: build/biophysics-validation.json
          if-no-files-found: error
          retention-days: 30

